<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>르셀란 견적서 생성기</title>

  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; color:#333; }
    .wrap { max-width:760px; margin:0 auto; }
    h1 { text-align:center; margin-bottom:6px; }
    .sub { text-align:center; color:#777; font-size:14px; margin-bottom:22px; }
    .card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 18px rgba(0,0,0,0.07); }
    h2 { font-size:18px; margin-top:0; }
    label { display:block; margin-top:12px; margin-bottom:6px; font-weight:bold; font-size:14px; }
    input, select { width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:15px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button { width:100%; border:none; background:#2f2f2f; color:white; padding:15px; border-radius:12px; font-size:16px; cursor:pointer; }
    button:hover { opacity:.9; }
    .small { color:#777; font-size:13px; margin-top:8px; }
    @media (max-width:600px) { .row { grid-template-columns:1fr; } }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LESELLANE 견적서 생성기</h1>
    <p class="sub">고객정보와 수량 입력 후 PNG 견적서를 다운로드합니다.</p>

    <div class="card">
      <h2>1. 고객 정보</h2>

      <label>성함</label>
      <input id="customerName" type="text" placeholder="예: 김지영">

      <label>번호</label>
      <input id="phone" type="text" placeholder="예: 010 2222 3333">

      <label>주소</label>
      <input id="address" type="text" placeholder="예: 대구 수성구 범어동 W주상복합">

      <div class="row">
        <div>
          <label>평형타입</label>
          <input id="pyeongType" type="text" placeholder="예: 34평">
        </div>

        <div>
          <label>확장 여부</label>
          <select id="expandType">
            <option value="베확장">베확장</option>
            <option value="비확장">비확장</option>
            <option value="부분확장">부분확장</option>
            <option value="확인필요">확인필요</option>
          </select>
        </div>
      </div>

      <label>시공공간</label>
      <select id="space">
        <option value="거실">거실</option>
        <option value="거실,복도">거실,복도</option>
        <option value="거실,복도,아일랜드">거실,복도,아일랜드</option>
        <option value="거실,복도,주방">거실,복도,주방</option>
        <option value="방1곳 별도견적">방1곳 별도견적</option>
        <option value="방2곳 별도견적">방2곳 별도견적</option>
        <option value="방3곳 별도견적">방3곳 별도견적</option>
      </select>

      <label>프로모션 문구</label>
      <input id="promotion" type="text" value="베이비페어 프로모션 혜택 적용">
    </div>

    <div class="card">
      <h2>2. 기본 제품 장수 입력</h2>
      <p class="small">750size / 1300size 장수를 입력하면 현금가·카드가 견적이 자동 계산됩니다.</p>

      <div class="row">
        <div>
          <label>750size 예상장수</label>
          <input id="qty750" type="number" step="0.5" placeholder="예: 70">
        </div>

        <div>
          <label>1300size 예상장수</label>
          <input id="qty1300" type="number" step="0.5" placeholder="예: 25">
        </div>
      </div>
    </div>

    <button onclick="downloadEstimate()">견적서 PNG 다운</button>
  </div>

<script>
const PRICE_750_CASH = 41000;
const PRICE_750_CARD = 44000;
const PRICE_1300_CASH = 137000;
const PRICE_1300_CARD = 145000;

function getValue(id) {
  return document.getElementById(id).value.trim();
}

function getNumber(id) {
  return parseFloat(document.getElementById(id).value) || 0;
}

function won(num) {
  return Number(num).toLocaleString("ko-KR") + "원";
}

function cleanFileName(name) {
  return (name || "고객").replace(/[\\/:*?"<>|]/g, "").trim();
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(src);
    img.src = encodeURI(src);
  });
}

async function loadBackground() {
  const files = ["원본.png", "original.png", "estimate-original.png"];
  for (const file of files) {
    try {
      return await loadImage(file);
    } catch(e) {}
  }
  throw new Error("원본.png 파일을 찾을 수 없습니다.");
}

function drawText(ctx, text, x, y, size, options = {}) {
  ctx.save();
  ctx.font = `${options.weight || "400"} ${size}px Arial, sans-serif`;
  ctx.fillStyle = options.color || "#3b3b3b";
  ctx.textAlign = options.align || "left";
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawRight(ctx, text, x, y, size, options = {}) {
  drawText(ctx, text, x, y, size, { ...options, align:"right" });
}

function downloadCanvas(canvas, filename) {
  canvas.toBlob(blob => {
    if (!blob) {
      alert("이미지 생성에 실패했습니다.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
  }, "image/png", 1.0);
}

async function downloadEstimate() {
  try {
    const bg = await loadBackground();

    const customerName = getValue("customerName") || "";
    const phone = getValue("phone") || "";
    const address = getValue("address") || "";
    const pyeongType = getValue("pyeongType") || "";
    const expandType = getValue("expandType") || "";
    const space = getValue("space") || "";
    const promotion = getValue("promotion") || "";

    const qty750 = getNumber("qty750");
    const qty1300 = getNumber("qty1300");

    const cash750 = qty750 * PRICE_750_CASH;
    const card750 = qty750 * PRICE_750_CARD;
    const cash1300 = qty1300 * PRICE_1300_CASH;
    const card1300 = qty1300 * PRICE_1300_CARD;

    const BASE_W = 1280;
    const BASE_H = 2048;
    const SCALE = 2;

    const canvas = document.createElement("canvas");
    canvas.width = BASE_W * SCALE;
    canvas.height = BASE_H * SCALE;

    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(bg, 0, 0, BASE_W, BASE_H);

    // CUSTOMER 정보
    drawText(ctx, `성함: ${customerName} 고객님`, 170, 610, 34);
    drawText(ctx, `번호: ${phone}`, 170, 660, 34);
    drawText(ctx, `주소: ${address}`, 170, 710, 34);
    drawText(ctx, `평형타입: ${pyeongType} (${expandType})`, 170, 760, 34);
    drawText(ctx, `시공공간: ${space}`, 170, 810, 34);
    drawText(ctx, promotion, 170, 860, 34);

    // 750 견적값
    drawRight(ctx, qty750 ? `${qty750}장` : "", 830, 1084, 34);
    drawRight(ctx, won(PRICE_750_CASH), 830, 1150, 34);
    drawRight(ctx, won(PRICE_750_CARD), 830, 1216, 34);
    drawRight(ctx, qty750 ? won(cash750) : "", 830, 1282, 34);
    drawRight(ctx, qty750 ? won(card750) : "", 830, 1348, 34);

    // 1300 견적값
    drawRight(ctx, qty1300 ? `${qty1300}장` : "", 830, 1605, 34);
    drawRight(ctx, won(PRICE_1300_CASH), 830, 1671, 34);
    drawRight(ctx, won(PRICE_1300_CARD), 830, 1737, 34);
    drawRight(ctx, qty1300 ? won(cash1300) : "", 830, 1803, 34);
    drawRight(ctx, qty1300 ? won(card1300) : "", 830, 1869, 34);

    const fileName = `${cleanFileName(customerName)}_르셀란견적서.png`;
    downloadCanvas(canvas, fileName);

  } catch (error) {
    alert("견적서 다운로드에 실패했습니다. GitHub 저장소에 원본.png 파일이 있는지 확인해주세요.");
    console.error(error);
  }
}
</script>
</body>
</html>
