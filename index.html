<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>르셀란 견적 템플릿</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1eb;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 28px;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d7d1c7;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      resize: vertical;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      background: #2b2723;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .copy {
      background: #8b735d;
    }

    .reset {
      background: #777;
    }

    button:hover {
      opacity: 0.9;
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .row, .btns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Lesellane 견적 템플릿</h1>
    <p class="sub">고객정보와 장수만 입력하면 문자/카톡용 견적서가 자동 생성됩니다.</p>

    <div class="card">
      <h2>1. 고객 정보</h2>

      <div class="row">
        <div>
          <label>성함</label>
          <input id="customerName" type="text" placeholder="예: 김지영">
        </div>

        <div>
          <label>번호</label>
          <input id="phone" type="text" placeholder="예: 010-0000-0000">
        </div>
      </div>

      <label>주소</label>
      <input id="address" type="text" placeholder="예: 대구 수성구 범어동 ○○아파트">

      <div class="row">
        <div>
          <label>평형타입</label>
          <input id="pyeongType" type="text" placeholder="예: 99e">
        </div>

        <div>
          <label>베확장 여부</label>
          <select id="expandType">
            <option value="베확장">베확장</option>
            <option value="베확장X">베확장X</option>
            <option value="부분확장">부분확장</option>
            <option value="확인필요">확인필요</option>
          </select>
        </div>
      </div>

      <label>시공공간</label>
      <input id="space" type="text" placeholder="예: 거실,복도라인">

      <label>프로모션 문구</label>
      <input id="promotion" type="text" value="베이비페어 프로모션 적용건">
    </div>

    <div class="card">
      <h2>2. 기본 제품 장수 입력</h2>
      <p class="small">단가는 고정되어 있습니다. 장수만 입력하면 자동 계산됩니다.</p>

      <div class="row">
        <div>
          <label>르셀란 600 장수</label>
          <input id="qtyLes600" type="number" step="0.5" placeholder="예: 96">
        </div>

        <div>
          <label>세디먼트 600 장수</label>
          <input id="qtySed600" type="number" step="0.5" placeholder="예: 96">
        </div>
      </div>

      <div class="row">
        <div>
          <label>르셀란 1200 장수</label>
          <input id="qtyLes1200" type="number" step="0.5" placeholder="예: 24">
        </div>

        <div>
          <label>세디먼트 1200 장수</label>
          <input id="qtySed1200" type="number" step="0.5" placeholder="예: 24">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>3. 방 추가 장수 입력</h2>
      <p class="small">방 추가가 없으면 비워두면 됩니다. 입력된 방만 출력됩니다.</p>

      <div class="row">
        <div>
          <label>방1 이름</label>
          <input id="room1Name" type="text" placeholder="예: 안방">
        </div>
        <div>
          <label>방1 장수</label>
          <input id="room1Qty" type="number" step="0.5" placeholder="예: 12">
        </div>
      </div>

      <div class="row">
        <div>
          <label>방2 이름</label>
          <input id="room2Name" type="text" placeholder="예: 작은방">
        </div>
        <div>
          <label>방2 장수</label>
          <input id="room2Qty" type="number" step="0.5" placeholder="예: 10">
        </div>
      </div>

      <div class="row">
        <div>
          <label>방3 이름</label>
          <input id="room3Name" type="text" placeholder="예: 서재">
        </div>
        <div>
          <label>방3 장수</label>
          <input id="room3Qty" type="number" step="0.5" placeholder="예: 8">
        </div>
      </div>
    </div>

    <div class="btns">
      <button onclick="generateText()">견적 생성</button>
      <button class="copy" onclick="copyText()">복사</button>
      <button class="reset" onclick="resetForm()">초기화</button>
    </div>

    <div class="card">
      <h2>출력 문구</h2>
      <textarea id="result" rows="34" readonly></textarea>
    </div>
  </div>

  <script>
    const PRICE_LES600 = 23500;
    const PRICE_SED600 = 25500;
    const PRICE_LES1200 = 115000;
    const PRICE_SED1200 = 125000;

    function won(num) {
      return Number(num).toLocaleString("ko-KR") + "원";
    }

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    function getNumber(id) {
      return parseFloat(document.getElementById(id).value) || 0;
    }

    function generateRoomText() {
      let roomText = "";

      const room1Name = getValue("room1Name");
      const room1Qty = getNumber("room1Qty");
      const room2Name = getValue("room2Name");
      const room2Qty = getNumber("room2Qty");
      const room3Name = getValue("room3Name");
      const room3Qty = getNumber("room3Qty");

      if (room1Name || room1Qty) {
        roomText += `\n◽방1 추가: ${room1Name || "-"} / ${room1Qty}장`;
      }

      if (room2Name || room2Qty) {
        roomText += `\n◽방2 추가: ${room2Name || "-"} / ${room2Qty}장`;
      }

      if (room3Name || room3Qty) {
        roomText += `\n◽방3 추가: ${room3Name || "-"} / ${room3Qty}장`;
      }

      return roomText;
    }

    function generateText() {
      const customerName = getValue("customerName") || "000";
      const phone = getValue("phone");
      const address = getValue("address");
      const pyeongType = getValue("pyeongType");
      const expandType = getValue("expandType");
      const space = getValue("space");
      const promotion = getValue("promotion");

      const qtyLes600 = getNumber("qtyLes600");
      const qtySed600 = getNumber("qtySed600");
      const qtyLes1200 = getNumber("qtyLes1200");
      const qtySed1200 = getNumber("qtySed1200");

      const totalLes600 = qtyLes600 * PRICE_LES600;
      const totalSed600 = qtySed600 * PRICE_SED600;
      const totalLes1200 = qtyLes1200 * PRICE_LES1200;
      const totalSed1200 = qtySed1200 * PRICE_SED1200;

      const roomText = generateRoomText();

      const text = `🌸저희 르셀란(Lesellane)을 찾아주셔서 진심으로 감사드립니다 ${customerName} 고객님, 프리미엄 품질과 완성도의 가치로 보답하겠습니다.

🌸층간소음디자인매트 견적서
◽성함: ${customerName} 고객님
◽번호: ${phone}
◽주소: ${address}
◽평형타입: ${pyeongType} (${expandType})
◽시공공간: ${space}
◽${promotion}${roomText}

🤍르셀란 600
600mmx600mmx22mm
예상장수: ${qtyLes600}장
예상금액: ${won(totalLes600)}
(프로모션 장당 ${won(PRICE_LES600)})

🤍세디먼트 600
600mmx600mmx22mm
예상장수: ${qtySed600}장
예상금액: ${won(totalSed600)}
(프로모션 장당 ${won(PRICE_SED600)})

🤍르셀란 800
800mmx800mmx22mm
※단종예정, 생산중단
※기존고객만 추가물량주문가능

🤍르셀란 1200
1,200mmx1,200mmx24mm
예상장수: ${qtyLes1200}장
예상금액: ${won(totalLes1200)}
(프로모션 장당 ${won(PRICE_LES1200)})

🤍세디먼트 1200
1,200mmx1,200mmx24mm
예상장수: ${qtySed1200}장
예상금액: ${won(totalSed1200)}
(프로모션 장당 ${won(PRICE_SED1200)})

☑️르셀란 컬러: 화이트크림, 린넨베이지, 린넨그레이

☑️세디먼트 컬러: 세디먼트스킨

☑️리뷰이벤트: 모바일상품권 5만원 혜택 (맘카페or지역카페 후기2건)

☑️공동구매혜택: 3가구 이상 진행시 각 가구당 -100,000원 추가할인 제공됩니다 (1200사이즈 한정이며 거실,복도 2개 공간 이상 진행시)

☑️해당견적은 현금가 프로모션이 적용된 기준이며, 세금계산서&현금영수증&신용카드 결제시에는 vat 5% 별도 발생되는점 참조부탁드립니다. 전문시공설치비용 & 출장비용은 모두 무료입니다

☑️예상수량의 경우 온라인도면 및 데이터값을 통해 산출된 양으로, 실제시공시 조금의 오차범위는 발생될 수 있습니다. 따라서 실제시공시 들어간 장수만큼만 카운터해 결제가 진행되겠습니다.

☑️프로모션은 시공일 기준이 아닌, 예약확정일 기준으로 적용되겠습니다.

☑️르셀란의 경우 시공일정 계약에 대한 예약금은 발생하지 않습니다.

☑️진행 희망시, 최종선택하신 제품과 컬러, 희망시공일정을 말씀주시면, 르셀란 직영지사배정후, 전문시공 기사님께서 스케쥴을 배정해드리게 되겠습니다`;

      document.getElementById("result").value = text;
    }

    function copyText() {
      const result = document.getElementById("result");

      if (!result.value.trim()) {
        alert("먼저 견적 생성을 눌러주세요.");
        return;
      }

      result.select();
      result.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(result.value)
        .then(() => alert("복사되었습니다."))
        .catch(() => alert("복사에 실패했습니다. 직접 드래그 후 복사해주세요."));
    }

    function resetForm() {
      const ids = [
        "customerName", "phone", "address", "pyeongType", "space",
        "qtyLes600", "qtySed600", "qtyLes1200", "qtySed1200",
        "room1Name", "room1Qty", "room2Name", "room2Qty", "room3Name", "room3Qty",
        "result"
      ];

      ids.forEach(id => document.getElementById(id).value = "");

      document.getElementById("expandType").value = "베확장";
      document.getElementById("promotion").value = "베이비페어 프로모션 적용건";
    }
  </script>
</body>
</html>
