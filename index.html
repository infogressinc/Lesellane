<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>견적 템플릿</title>
</head>
<body>

<h1>견적 테스트</h1>

<input type="text" id="name" placeholder="고객명 입력" />
<button onclick="makeText()">생성</button>

<br><br>

<textarea id="result" rows="10" cols="50"></textarea>

<script>
function makeText() {
  const name = document.getElementById("name").value;

  const text = `고객명: ${name}

르셀란 층간소음디자인매트 견적 안내드립니다.
감사합니다.`;

  document.getElementById("result").value = text;
}
</script>

</body>
</html>
