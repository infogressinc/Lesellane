<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>르셀란 견적 문자 생성기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f1ec;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d7d1c7;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
    }

    .check input {
      width: auto;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      background: #2b2723;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .copy {
      background: #8b735d;
    }

    .reset {
      background: #777;
    }

    @media (max-width: 600px) {
      .row, .btns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Lesellane 견적 문자 생성기</h1>
    <p class="sub">고객 정보 입력 → 견적 문구 자동 생성 → 복사 후 카톡/문자 발송</p>

    <div class="card">
      <h2>1. 고객 정보</h2>

      <div class="row">
        <div>
          <label>고객명</label>
          <input id="customerName" type="text" placeholder="예: 김지영 고객님">
        </div>

        <div>
          <label>연락처</label>
          <input id="phone" type="text" placeholder="예: 010-0000-0000">
        </div>
      </div>

      <label>지역 / 아파트명</label>
      <input id="siteName" type="text" placeholder="예: 대구 수성구 범어동 ○○아파트">

      <div class="row">
        <div>
          <label>평형</label>
          <input id="pyeong" type="text" placeholder="예: 34평">
        </div>

        <div>
          <label>발코니 확장 여부</label>
          <select id="expandType">
            <option value="">선택</option>
            <option value="발코니 확장">발코니 확장</option>
            <option value="비확장">비확장</option>
            <option value="부분확장">부분확장</option>
            <option value="확인필요">확인필요</option>
          </select>
        </div>
      </div>

      <label>시공 예정 공간</label>
      <select id="range">
        <option value="">선택</option>
        <option value="거실">거실</option>
        <option value="거실 + 복도">거실 + 복도</option>
        <option value="거실 + 복도 + 주방">거실 + 복도 + 주방</option>
        <option value="거실 + 복도 + 주방 + 방">거실 + 복도 + 주방 + 방</option>
        <option value="전체 시공">전체 시공</option>
        <option value="상담 후 확정">상담 후 확정</option>
      </select>
    </div>

    <div class="card">
      <h2>2. 제품 / 수량 / 금액</h2>

      <label>제품 선택</label>
      <select id="product">
        <option value="르셀란 프리미엄 1200">르셀란 프리미엄 1200</option>
        <option value="르셀란 프리미엄 600">르셀란 프리미엄 600</option>
        <option value="1200 + 600 혼합 시공">1200 + 600 혼합 시공</option>
      </select>

      <div class="row">
        <div>
          <label>1200 매트 장수</label>
          <input id="qty1200" type="number" step="0.5" placeholder="예: 28">
        </div>

        <div>
          <label>1200 매트 단가</label>
          <input id="price1200" type="number" value="0">
        </div>
      </div>

      <div class="row">
        <div>
          <label>600 매트 장수</label>
          <input id="qty600" type="number" step="0.5" placeholder="예: 12">
        </div>

        <div>
          <label>600 매트 단가</label>
          <input id="price600" type="number" value="0">
        </div>
      </div>

      <label>추가 할인 금액</label>
      <input id="discount" type="number" value="0" placeholder="예: 100000">

      <div class="check">
        <input id="reviewEvent" type="checkbox">
        <span>리뷰 이벤트 안내 포함</span>
      </div>

      <div class="check">
        <input id="premiumText" type="checkbox" checked>
        <span>프리미엄 안내 문구 포함</span>
      </div>
    </div>

    <div class="card">
      <h2>3. 상담 메모</h2>

      <label>추가 안내사항</label>
      <textarea id="memo" rows="4" placeholder="예: 공동구매가 적용 / 이번 주 시공 가능 / 샘플 확인 후 결정 예정"></textarea>
    </div>

    <div class="btns">
      <button onclick="generateText()">견적 생성</button>
      <button class="copy" onclick="copyText()">복사</button>
      <button class="reset" onclick="resetForm()">초기화</button>
    </div>

    <div class="card">
      <h2>출력 문구</h2>
      <textarea id="result" rows="22" readonly></textarea>
    </div>
  </div>

  <script>
    function numberFormat(num) {
      return Number(num).toLocaleString("ko-KR");
    }

    function generateText() {
      const customerName = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const siteName = document.getElementById("siteName").value.trim();
      const pyeong = document.getElementById("pyeong").value.trim();
      const expandType = document.getElementById("expandType").value;
      const range = document.getElementById("range").value;
      const product = document.getElementById("product").value;

      const qty1200 = parseFloat(document.getElementById("qty1200").value) || 0;
      const price1200 = parseFloat(document.getElementById("price1200").value) || 0;
      const qty600 = parseFloat(document.getElementById("qty600").value) || 0;
      const price600 = parseFloat(document.getElementById("price600").value) || 0;
      const discount = parseFloat(document.getElementById("discount").value) || 0;

      const memo = document.getElementById("memo").value.trim();
      const reviewEvent = document.getElementById("reviewEvent").checked;
      const premiumText = document.getElementById("premiumText").checked;

      const total1200 = qty1200 * price1200;
      const total600 = qty600 * price600;
      const total = total1200 + total600;
      const finalTotal = total - discount;

      let text = `안녕하세요, ${customerName || "고객님"}.
프리미엄 층간소음매트 브랜드 르셀란입니다.

문의주신 내용 기준으로 예상 견적 안내드립니다.

[고객 정보]
· 고객명: ${customerName || "-"}
· 연락처: ${phone || "-"}
· 현장: ${siteName || "-"}
· 평형: ${pyeong || "-"}
· 확장 여부: ${expandType || "-"}
· 시공 예정 공간: ${range || "-"}

[제품 안내]
· 제품: ${product}
· 1200 매트: ${qty1200}장
· 600 매트: ${qty600}장
`;

      if (price1200 > 0 || price600 > 0) {
        text += `
[예상 금액]
· 1200 매트 금액: ${numberFormat(total1200)}원
· 600 매트 금액: ${numberFormat(total600)}원
· 상품 합계: ${numberFormat(total)}원
· 추가 할인: ${numberFormat(discount)}원
· 최종 예상 금액: ${numberFormat(finalTotal)}원
`;
      }

      if (premiumText) {
        text += `
[르셀란 안내]
르셀란 매트는 공간의 분위기를 해치지 않는 고급스러운 컬러감과
탄탄한 쿠션감, 깔끔한 마감 완성도를 중점으로 제작된 프리미엄 시공매트입니다.

대형 사이즈 매트 시공으로 이음선은 줄이고,
거실·복도·주방까지 보다 넓고 정돈된 인테리어 느낌으로 완성됩니다.
`;
      }

      if (reviewEvent) {
        text += `
[리뷰 이벤트]
시공 후 간단한 후기 참여 시
별도 페이백 혜택을 안내드리고 있습니다.
자세한 내용은 상담 시 함께 안내드리겠습니다.
`;
      }

      if (memo) {
        text += `
[추가 안내]
${memo}
`;
      }

      text += `
※ 위 견적은 입력 정보 기준의 예상 견적이며,
도면 확인 및 최종 시공 범위에 따라 장수와 금액은 일부 달라질 수 있습니다.

감사합니다.
르셀란 드림`;

      document.getElementById("result").value = text;
    }

    function copyText() {
      const result = document.getElementById("result");

      if (!result.value.trim()) {
        alert("먼저 견적 생성을 눌러주세요.");
        return;
      }

      result.select();
      result.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(result.value)
        .then(() => alert("복사되었습니다."))
        .catch(() => alert("복사에 실패했습니다. 직접 선택 후 복사해주세요."));
    }

    function resetForm() {
      document.getElementById("customerName").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("siteName").value = "";
      document.getElementById("pyeong").value = "";
      document.getElementById("expandType").value = "";
      document.getElementById("range").value = "";
      document.getElementById("product").value = "르셀란 프리미엄 1200";
      document.getElementById("qty1200").value = "";
      document.getElementById("price1200").value = "0";
      document.getElementById("qty600").value = "";
      document.getElementById("price600").value = "0";
      document.getElementById("discount").value = "0";
      document.getElementById("memo").value = "";
      document.getElementById("reviewEvent").checked = false;
      document.getElementById("premiumText").checked = true;
      document.getElementById("result").value = "";
    }
  </script>
</body>
</html>
